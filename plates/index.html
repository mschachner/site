<!DOCTYPE html>
<!-- Permanent redirect: mark-schachner.com/plates -> platesgame.com.
     Carries the visitor's Plates localStorage (streaks/stats) across origins
     in the URL fragment, which is never sent to any server. Lives forever in
     the site repo's plates/ directory so old bookmarks and share links keep
     working and migrating. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Plates</title>
<script>
(function () {
  var DEST = 'https://platesgame.com/';
  var PREFIX = 'plates-';
  // The GitHub PAT never rides along: the fragment isn't sent to servers,
  // but it does land in local browser history.
  var EXCLUDE = ['plates-gh-token'];

  var out = {};
  var found = false;
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k.indexOf(PREFIX) !== 0) continue;   // origin is shared with other
    if (EXCLUDE.indexOf(k) !== -1) continue; // mark-schachner.com projects
    out[k] = localStorage.getItem(k);
    found = true;
  }

  if (!found) { location.replace(DEST); return; }

  var bytes = new TextEncoder().encode(JSON.stringify(out));
  var bin = '';
  for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
  var payload = btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  location.replace(DEST + '#migrate=' + payload);
})();
</script>
</head>
<body>
  <noscript>
    <a href="https://platesgame.com/">Plates has moved to platesgame.com.</a>
  </noscript>
</body>
</html>
