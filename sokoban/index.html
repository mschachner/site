<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9dc">
  <title>sokoban</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='15' y='15' width='70' height='70' rx='22' fill='%23c0784e'/%3E%3C/svg%3E">
  <!-- installable web app -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="sokoban">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">sokoban<span>.</span></h1>
    <div class="puzzle">
      <div class="params" id="params">
        <button class="param" data-picker="difficulty" aria-haspopup="listbox" aria-expanded="false">
          <span class="param-label">difficulty</span>
          <span class="param-value"><span class="param-text"></span><span class="param-caret" data-icon="chevron"></span></span>
        </button>
        <button class="param" data-picker="boxes" aria-haspopup="listbox" aria-expanded="false">
          <span class="param-label">boxes</span>
          <span class="param-value"><span class="param-text"></span><span class="param-caret" data-icon="chevron"></span></span>
        </button>
        <button class="param" data-picker="size" aria-haspopup="listbox" aria-expanded="false">
          <span class="param-label">size</span>
          <span class="param-value"><span class="param-text"></span><span class="param-caret" data-icon="chevron"></span></span>
        </button>
      </div>
      <button id="newBtn" class="primary">new</button>
    </div>
    <div class="icons">
      <button id="themeBtn" class="icon" title="settings (t)" aria-label="settings" data-icon="sliders"></button>
      <button id="scoresBtn" class="icon" title="scores (g)" aria-label="scores" data-icon="star"></button>
      <button id="helpBtn" class="icon" title="help (?)" aria-label="help" data-icon="help"></button>
    </div>
  </header>

  <main>
    <div class="hud">
      <div class="hud-left">
        <button id="timerToggle" class="icon small" title="toggle timer" aria-label="toggle timer" data-icon="timer"></button>
        <span id="timer" class="stat">0:00</span>
      </div>
      <div class="hud-mid">
        <span id="moveStat" class="stat">…</span>
        <span id="rating" class="rating"></span>
      </div>
      <div class="hud-right" id="hudActions"></div>
    </div>

    <div id="boardWrap">
      <div id="board">
        <div id="tiles"></div>
        <div id="entities"></div>
      </div>
      <div id="overlay" class="overlay hidden"></div>
    </div>

    <p class="hint">
      <span class="key-hint">arrows to move · <kbd>z</kbd> undo · <kbd>r</kbd> reset · <kbd>enter</kbd> new · <kbd>?</kbd> help</span>
      <span class="touch-hint">swipe to move · hold &amp; drag to keep moving</span>
    </p>

    <!-- undo/redo/reset/pause live here; on narrow screens they are moved
         into the bottom bar (see placeActions in main.js) -->
    <div class="actions" id="actions">
      <button id="undoBtn" class="icon" title="undo (z)" aria-label="undo" data-icon="undo"></button>
      <button id="redoBtn" class="icon" title="redo (y)" aria-label="redo" data-icon="redo"></button>
      <button id="resetBtn" class="icon" title="reset (r)" aria-label="reset" data-icon="reset"></button>
      <button id="pauseBtn" class="icon" title="pause (p)" aria-label="pause" data-icon="pause"></button>
    </div>
    <div class="bottombar" id="bottomBar"></div>
  </main>

  <div id="panelScrim" class="panel-scrim hidden"></div>
  <aside id="panel" class="panel hidden"></aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
